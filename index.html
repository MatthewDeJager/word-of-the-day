<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word of the Day</title>
<meta name="description" content="A sophisticated, uncommon English word on every visit.">

<!-- PWA / install -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word of the Day">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="label">Word of the Day</div>
    <h1 class="word" id="word">—</h1>
    <div class="pronunciation" id="pronunciation" hidden></div>
    <div class="pos" id="pos">—</div>
    <p class="definition" id="definition">—</p>
    <p class="example" id="example" hidden></p>
    <p class="synonyms" id="synonymsRow" hidden><span class="synonyms-label">Synonyms:</span> <span id="synonyms"></span></p>
    <div class="actions">
      <button id="newWord" type="button" disabled>New word</button>
      <span class="hint">or press space</span>
    </div>
  </main>
</body>
</html>
